
name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      OPENAI_API_KEY: test-key-not-real
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rag_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run API tests
        run: python -m pytest tests/ -q

  docker-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t scientific-agentic-rag .

      - name: Start container
        run: |
          docker run -d \
            --name scientific-agentic-rag \
            --network host \
            -e OPENAI_API_KEY=test-key-not-real \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rag_test \
            scientific-agentic-rag

      - name: Wait for API
        run: |
          for i in {1..20}; do
            if curl -f http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs scientific-agentic-rag
          exit 1